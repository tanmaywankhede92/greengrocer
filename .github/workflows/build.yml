name: Build APK + iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: greengrocer-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: Build iOS IPA (signed)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - run: flutter pub get

      - run: pod install
        working-directory: ios

      # 1. Create temporary keychain and import signing certificate
      - name: Import Apple Distribution Certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temp keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Decode and import cert
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      # 2. Install provisioning profile
      - name: Install Provisioning Profile
        env:
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISION_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      # 3. Build signed IPA
      - name: Build IPA
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: flutter build ipa --release --export-options-plist ios/ExportOptions.plist --no-pub

      # 4. Upload IPA
      - uses: actions/upload-artifact@v4
        with:
          name: greengrocer-release-ipa
          path: build/ios/ipa/Runner.ipa

      # 5. (Optional) Upload to TestFlight (skips if API key not configured)
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "Skipping TestFlight upload — no API key configured"
            exit 0
          fi
          echo "$APP_STORE_CONNECT_API_KEY" > /tmp/api_key.p8
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/Runner.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"